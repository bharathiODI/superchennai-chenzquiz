name: Deploy

# push to main -> LIVE  https://chenzquiz.superchennai.com
# push to demo -> DEMO  https://chenzquiz-demo.superchennai.com (internal testing, test users)
# Code is uploaded to the VPS and built there (the build needs that site's database), then
# switched over by scripts/deploy.sh. Both sites build on the same server; deploy.sh queues
# them so only one builds at a time. See DEPLOYMENT.md ("Demo first").
on:
  push:
    branches: [main, demo]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'LIVE' || 'DEMO' }}
    if: github.ref_name == 'main' || github.ref_name == 'demo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      # Where the site lives on the server, its PM2 name and port, and its address
      DEPLOY_PATH: ${{ github.ref_name == 'main' && (secrets.DEPLOY_PATH || '/var/www/chenzquiz') || (vars.DEMO_PATH || '/var/www/chenzquiz-demo') }}
      APP_NAME: ${{ github.ref_name == 'main' && 'chenzquiz-superchennai' || 'chenzquiz-demo' }}
      APP_PORT: ${{ github.ref_name == 'main' && '3007' || (vars.DEMO_PORT || '3017') }}
      SITE_URL: ${{ github.ref_name == 'main' && 'https://chenzquiz.superchennai.com' || (vars.DEMO_URL || 'https://chenzquiz-demo.superchennai.com') }}

    steps:
      - name: Check deploy secrets
        env:
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          missing=0
          for v in DEPLOY_HOST DEPLOY_USER; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v (see DEPLOYMENT.md)"; missing=1; fi
          done
          if [ "$HAS_KEY" != "true" ]; then echo "::error::Missing repository secret DEPLOY_SSH_KEY (see DEPLOYMENT.md)"; missing=1; fi
          exit $missing

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Release name
        id: release
        run: echo "name=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  ServerAliveInterval 30\n  ConnectTimeout 20\n  ConnectionAttempts 2\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_PORT" > ~/.ssh/config

      - name: Check the site is set up on the server
        run: |
          # A dropped connection is retried; "can't reach" and "not set up" get their own messages.
          reached=0
          for try in 1 2 3 4; do
            if ssh prod true; then reached=1; break; fi
            echo "Server not reachable over SSH (try $try of 4) - retrying in 15 s"
            sleep 15
          done
          if [ "$reached" != 1 ]; then
            echo "::error::Can't reach the server over SSH (port $DEPLOY_PORT). Re-run the job. If it fails again, check on the server that sshd is running and that no firewall (Hostinger VPS firewall, ufw, fail2ban) blocks GitHub's addresses."
            exit 1
          fi
          # shellcheck disable=SC2029  # paths are meant to expand here, on the runner
          if ! ssh prod "test -f '$DEPLOY_PATH/shared/.env'"; then
            echo "::error::$DEPLOY_PATH/shared/.env not found on the server. For the demo site run scripts/demo-setup.sh on the server once (see DEPLOYMENT.md)."
            exit 1
          fi

      - name: Upload release
        env:
          RELEASE: ${{ steps.release.outputs.name }}
        run: |
          # shellcheck disable=SC2029  # paths are meant to expand here, on the runner
          ssh prod "mkdir -p '$DEPLOY_PATH/releases/$RELEASE'"
          rsync -az --delete \
            --exclude '.git/' --exclude 'node_modules/' --exclude '.next/' \
            --exclude '.env' --exclude '.env.*' --exclude 'public/media/' \
            --exclude 'db/' --exclude '_local/' \
            ./ "prod:$DEPLOY_PATH/releases/$RELEASE/"

      - name: Install, build and go live
        env:
          RELEASE: ${{ steps.release.outputs.name }}
        run: |
          # shellcheck disable=SC2029  # paths are meant to expand here, on the runner
          ssh prod "APP_ROOT='$DEPLOY_PATH' APP_NAME='$APP_NAME' APP_PORT='$APP_PORT' bash '$DEPLOY_PATH/releases/$RELEASE/scripts/deploy.sh' '$RELEASE' '$GITHUB_SHA'"

      - name: Summary
        if: success()
        env:
          RELEASE: ${{ steps.release.outputs.name }}
        run: |
          echo "### Deployed \`$RELEASE\` to ${{ github.ref_name == 'main' && 'LIVE' || 'DEMO' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "$SITE_URL (check $SITE_URL/version.json)" >> "$GITHUB_STEP_SUMMARY"
